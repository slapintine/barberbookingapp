server {
    listen 80;
    listen [::]:80;
    server_name queless.org www.queless.org;

    client_max_body_size 10m;
    root /var/www/queless.org/current/line-up-barber-website/dist;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        alias /var/www/queless.org/current/barber-booking-app/frontend/dist/;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /app/index.html;
    }

    location /app/assets/ {
        alias /var/www/queless.org/current/barber-booking-app/frontend/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /app/version.json {
        alias /var/www/queless.org/current/barber-booking-app/frontend/dist/version.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Bootstrap equivalent of the HTTPS release location. Production traffic
    # uses the TLS server block in queless.org.conf.
    location ~ ^/downloads/(queless-(?:latest|v[0-9]+\.[0-9]+\.[0-9]+)\.apk)$ {
        alias /var/www/queless.org/releases/android/$1;
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=\"$1\"" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /downloads/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
    }
}
